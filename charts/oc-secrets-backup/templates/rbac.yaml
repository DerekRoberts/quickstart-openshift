{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oc-secrets-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oc-secrets-backup.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oc-secrets-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oc-secrets-backup.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oc-secrets-backup.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oc-secrets-backup.fullname" . }}
{{- end }}

