{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oc-secrets-backup.fullname" . }}-scripts
  labels:
    {{- include "oc-secrets-backup.labels" . | nindent 4 }}
data:
  backup-secrets.sh: |-
    #!/bin/sh
    set -eu

    NS="{{ default .Release.Namespace .Values.backup.namespace }}"
    FORMAT="{{ default "yaml" .Values.backup.output.format }}"
    RETENTION_DAYS="{{ default 30 .Values.backup.output.retentionDays }}"

    NOW="$(date -u +%Y%m%dT%H%M%SZ)"
    BASE_DIR="/backups"
    OUT_DIR="${BASE_DIR}/secrets_${NS}_${NOW}"
    ARCHIVE="${OUT_DIR}.tar.gz"

    mkdir -p "${OUT_DIR}"

    echo "Backing up secrets from namespace: ${NS}"

    # Build an explicit list of secrets to dump.
    secrets=""

    {{- if .Values.backup.secrets.names }}
    secrets="{{ join " " .Values.backup.secrets.names }}"
    {{- else if .Values.backup.secrets.labelSelector }}
    secrets="$(kubectl get secrets -n "${NS}" -l '{{ .Values.backup.secrets.labelSelector }}' -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}')"
    {{- else }}
    secrets="$(kubectl get secrets -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}')"
    {{- end }}

    if [ -z "${secrets}" ]; then
      echo "No secrets matched; nothing to back up."
      exit 0
    fi

    for name in ${secrets}; do
      {{- if .Values.backup.secrets.excludeNames }}
      case " {{ join " " .Values.backup.secrets.excludeNames }} " in
        *" ${name} "*) echo "Skipping excluded secret: ${name}"; continue ;;
      esac
      {{- end }}

      type="$(kubectl get secret -n "${NS}" "${name}" -o jsonpath='{.type}' 2>/dev/null || true)"
      {{- if .Values.backup.secrets.excludeTypes }}
      case " {{ join " " .Values.backup.secrets.excludeTypes }} " in
        *" ${type} "*) echo "Skipping excluded secret type (${type}): ${name}"; continue ;;
      esac
      {{- end }}

      echo "Dumping secret: ${name}"
      if [ "${FORMAT}" = "json" ]; then
        kubectl get secret -n "${NS}" "${name}" -o json > "${OUT_DIR}/${name}.json"
      else
        kubectl get secret -n "${NS}" "${name}" -o yaml > "${OUT_DIR}/${name}.yaml"
      fi
    done

    echo "Creating archive: ${ARCHIVE}"
    tar -C "${BASE_DIR}" -czf "${ARCHIVE}" "$(basename "${OUT_DIR}")"
    rm -rf "${OUT_DIR}"

    if [ "${RETENTION_DAYS}" != "0" ]; then
      echo "Pruning archives older than ${RETENTION_DAYS} days"
      find "${BASE_DIR}" -maxdepth 1 -type f -name 'secrets_*.tar.gz' -mtime "+${RETENTION_DAYS}" -delete || true
    fi

    echo "Backup complete: ${ARCHIVE}"
{{- end }}

