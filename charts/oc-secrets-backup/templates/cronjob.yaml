{{- if .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "oc-secrets-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oc-secrets-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "oc-secrets-backup.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "oc-secrets-backup.serviceAccountName" . }}
          restartPolicy: Never
          activeDeadlineSeconds: 900
          containers:
            - name: oc-secrets-backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - /scripts/backup-secrets.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: scripts
              configMap:
                name: {{ include "oc-secrets-backup.fullname" . }}-scripts
                defaultMode: 0555
            - name: backups
              {{- if .Values.pvc.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "oc-secrets-backup.pvcName" . }}
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}

