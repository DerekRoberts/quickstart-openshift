enabled: true

image:
  # Public image with kubectl; avoids custom image builds.
  repository: docker.io/bitnami/kubectl
  tag: "latest"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "0 6 * * *"
  startingDeadlineSeconds: 3600

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

pvc:
  enabled: true
  name: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  annotations:
    helm.sh/resource-policy: keep

backup:
  # If empty, defaults to release namespace.
  namespace: ""

  # Minimal config: explicitly list the secrets to back up.
  secrets:
    names: []
    # Example: route TLS secrets typically have type `kubernetes.io/tls`
    # names:
    #   - my-route-tls

